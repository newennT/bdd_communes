#Index des pays
Aucun pays à afficher: Pouint aoqhun payiz a amontrer
Les pays traditionnels sont nombreux et il serait inutile de chercher à en dresser une liste exhaustive. Leur nombre et leurs limites peuvent varier en fonction des époques et de la distinction ou non que l’on fait entre le terroir et le pays. Le but, de cette carte comme de celles de ce site, est plutôt de donner un aperçu de la diversité des territoires bretons.: N-i a berchôze de payiz coutumiérs, i seraet inserviabl qe d’assayer de n-en fére eune rolée parfinie. Lous nombr e lous separts chanjent selon la berouée pis de l’apartézon qe n-en done entr terrouere e payiz. Le but de la carte-la come des aotrs su l’empllâ-la ét pus fort de montrer eune aperçue de la gârerie des terroueres bertons.
Certains de ces pays ont une origine qui remonte à l’Antiquité, d’autres remontent aux débuts de l’ère bretonne. La division la plus ancienne est le “paou” qui est l’échelon inférieur à la “bro”.  On retrouve ce mot dans les noms qui commencent par po- et pou- (Poher, de paou et kêr, citadelle, celle-ci étant Carhaix), Porhoët (paou/tro/koed, le pays à travers les bois): Qheuqes payiz en-méle de yeûs s’orinent de l’Antiqhitë ou de l’arivée des bertons pour d’aotrs. Le “paou” ét le separt q’ét le pus vieu, c’ét le pus petit rolon qe la “bro”. Nen vait le mot-la den les noms en po- e pou- (Poher, de paou e kêr, citadelle, la siene de Carhaix), Porhoët (paou/tro/koed, le payiz ao través les bouéz).
Des noms beaucoup plus récents font référence à des modes vestimentaires. C’est fréquent en Cornouaille, comme Glazik (petit bleu, en référence aux costumes). D’autres peuvent faire référence à des productions, comme Penn Sardin, tête de sardine, à Douarnenez. D’habitudes lexicales, comme le pays Chtou, à partir du juron Mallozh Doue! (malédiction de Dieu), prononcé localement « mallochtou! ». Certains tirent leurs particularités de circonstances géographiques particulières, comme le Mené, « la Montagne » ou la Brière. D’autres enfin peuvent être le fruit de l’influence d’un centre urbain, c’est le cas de Redon, qui, depuis des millénaires, s’est toujours retrouvé en bordure de divisions.: Des nom pus frés s’orinent des modes de hardes. Come en Cornouâille o le Glazik (petit blleu, du nom de l’abis coutumier). D’aotrs s’orinent de la fézerie du payiz, come Penn-Sardin (téte de sardrine a Douarnenez); des menieres de dire, come le payiz Chtou ‘you qi parfétent Mallozh Doue (maocion de dieu) “Mallochtou”. Ça qi peut etout s’oriner de la jeyografie, come le Menë (Montagne en berton) ou La Beriere (bruyère en françaez). A la parfin, i n-a des payiz q’ont nom d’aprés la grand-vile, come Redon qi depés des miles d’anées a terjous të és racouins des separts.

#Index des provinces
Aucune province à afficher: Pouint aoqhune pervince a montrer
Source: Orine
La principale division territoriale traditionnelle de la Bretagne sont les “bro” (pays ou provinces). Ils sont au nombre de neuf, symbolisés sur le drapeau breton Gwenn-ha-Du par les neuf bandes alternées noires et blanches. Même si ces pays ont perdu toute réalité officielle depuis 1790 et la création des départements, ils existent toujours dans le vécu.: Les permiers separts coutumiérs de la Bertègn sont les “bro” (payiz ou pervinces). I n-n a neuf, come montrë su le Gâre-Nair (Gwenn-ha-Du) par neu bandes naires e bllanches. Biao qe les payiz-la n’ont asteure pus aoqhun role oficiao depés 1790 cant qe les departements furent levës, le monde s’aqenéssent tenant den yeûs pâs-meins.
Ces échelons ont été mis en place officiellement par les Bretons pour prendre la relève de l’administration romaine à la chute de l’Empire romain, mais semblent recouvrir une réalité humaine et historique qui remonte à plus loin. Les limites coïncident en effet avec des éléments géographiques remarquables (grands cours d’eau, lignes de crête) ou avec des éléments humains remontant à une haute antiquité, comme des mégalithes ou des toponymes pré-bretons.: Les rolons-la furent minz su bout d’ofice par les bertons pour prendr la sieute de la fezanderie romaine cant qe lous empire chayit. Meins sembele q’il ont tout come eune veritë oumaine e istoriqe remontant de pus lein. A-don, les separts vont ben o la jeyografie (rivieres, crétes de butes) ou ben o des merqes oumaines de l’Antiqhitë come ça seraet des roches piqhées o des noms d’endrets gaolouéz.
Ces divisions coïncident également dans les grandes lignes avec les territoires des anciens peuples celtes. Au territoire des Osismes correspondent la Cornouaille, le Léon et le Trégor, au territoire des Vénètes correspond le Pays vannetais,  au territoire des anciens Coriosolitesaux les pays de Saint-Brieuc, Saint-Malo et Dol, au territoire des Namnètes le Nantais et au territoire des Riedones le Rennais.: Etout, les separts-la vont manierement o les terroueres és gaolouéz d’aotrfai. La terre és Osisms advient ben o la Cornouâille-Leyon-Tregor; le payiz de Vane retire den le terrouere des Venetes; les Coriosolites restaent den les payiz de Saint-Berieu, de Dou pis du Cllôz-Poulet; Les Namnetes e les Riedones donirent lous nom és viles de Naonte e Rene.

