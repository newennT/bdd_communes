La structure territoriale de la Bretagne est complexe, les territoires la composant ayant évolué au cours de l'Histoire. On distingue communément deux niveaux de pays.: La Bertègn ét charpentée d’eune meniere nijante, long l'isoutere i n-a y-û eune entournerie den les payiz qi la font. N-i a deûz meniere de payiz.
Les provinces, aussi appelées parfois "évêchés", sont au nombre de neuf. Avant la révolution, elles servaient, en plus de leur rôle religieux, de circonscriptions civiles et militaires.: N-i a neu pervinces, q'ont etout nom "evéchës". Avant la Revoûsserie, en pus qe de lous rôle pour la relijion, i furent des arétas civiles e mirlitéres.
Les pays n'ont pas de limites fixes. Ces pays dits de tradition ou de mode peuvent avoir eu au cours de l'histoire des vocations très diverses. Certains d'entre eux ont eu un rôle administratif tandis que d'autres sont essentiellement des territoires identitaires.: Les payiz n'ont pouint d'arétas abutës. Les payiz-la dits coutumiérs ou de ghize pouvaent avair long l'istouere des rôles pouint parai. D'aoqhuns en-méle yeûs ont y-û un rôle de fezanderie aloure qe d'aotrs sont ren qe dés aires de filomie.
Des remarques, des corrections à apporter, des suggestions ? Vous pouvez me contacter via mon site.: Des aviz, des corijeries a fére, des idées ? Vous pouvéz me toucher par mon empllâ.
