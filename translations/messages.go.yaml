Les provinces de Bretagne sont au nombre de neuf. Avant la révolution, ils servaient, en plus de leur rôle religieux, de circonscriptions civiles et militaires.: N-i a neu pervinces en Bertègn. Avant la Revoûsserie, en pus qe de lous rôle pour la relijion, a taent des arétas civiles e mirlitéres.
Les pays traditionnels de Bretagne n’ont pas de limites fixes. Au cours du temps, ils ont eu des vocations très diverses.: Les payiz coutumiérs de Bertègn n'ont pouint d'arétas abutës. Long l'istouere, il ûrent des rôles pouint parai.
En 2025, la Bretagne historique compte 1415 communes. Explorez-les sur cette carte et retrouvez leurs pays traditionnels.: En 2025, la Bertègn istoriqe conte un 1415 de qemunes. Fourgotéz-les den la carte-la pis terouéz d’ertour lous payiz coutumiérs.